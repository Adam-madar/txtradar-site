<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email confirmed — txtradar</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#FBFBFD; --bg-elev:#FFFFFF; --card:#FFFFFF;
    --text:#1D1D1F; --muted:#5D6570; --faint:#8A9099;
    --line:rgba(0,0,0,.08);
    --accent:#0EA968; --accent-soft:rgba(14,169,104,.12);
    --shadow:0 24px 70px rgba(20,30,40,.12);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0B0C0F; --bg-elev:#131419; --card:#15161B;
      --text:#F5F6F8; --muted:#9BA1AB; --faint:#6B7178;
      --line:rgba(255,255,255,.09);
      --accent:#32D28E; --accent-soft:rgba(50,210,142,.14);
      --shadow:0 24px 70px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
    font:400 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:440px; width:100%; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    box-shadow:var(--shadow);
    padding:44px 36px;
  }
  @media (prefers-reduced-motion: no-preference){
    .card{animation:arrive .55s cubic-bezier(.25,1,.4,1)}
    @keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  }
  .check{
    width:64px; height:64px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent); display:flex; align-items:center; justify-content:center;
    margin:0 auto 20px; font-size:30px;
  }
  h1{font-size:1.7rem; letter-spacing:-.018em; font-weight:700; margin-bottom:10px; text-wrap:balance}
  p{font-size:15.5px; color:var(--muted); margin-bottom:8px}
  ol{text-align:left; font-size:15.5px; color:var(--muted); margin:18px auto 4px; padding-left:22px; max-width:330px}
  ol li{margin-bottom:8px}
  b{color:var(--text); font-weight:600}
  .brand{
    display:flex; align-items:center; justify-content:center; gap:8px; margin-top:28px;
    font-size:14px; font-weight:600; letter-spacing:-.01em; color:var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Email confirmed</h1>
    <p>Your txtradar account is ready.</p>
    <ol>
      <li>Go back to <b>Chrome</b></li>
      <li>Click the <b>txtradar icon</b> in the toolbar</li>
      <li><b>Sign in</b> with your email and password</li>
    </ol>
    <div class="brand">
      <span id="brandRadar" style="flex:none;"></span>
      txtradar
    </div>
  </div>
  <script src="assets/radar.js"></script>
  <script>
    if (window.Radar) Radar.mount(document.getElementById("brandRadar"), { size: 22 });
  </script>
</body>
</html>
